name: Dependabot
on:
  - pull_request

env:
  GOPROXY: https://proxy.golang.org
  GOPATH: ${{ github.workspace }}/go

permissions:
  contents: write

jobs:
  update-dependabot:
    if:  startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-20.04
    steps:
      - name: Set up go
        uses: actions/setup-go@b22fbbc2921299758641fab08929b4ac52b32923
        with:
          go-version: 1.18.1

      - uses: actions/checkout@629c2de402a417ea7690ca6ce3f33229e27606a5 # v2 https://api.github.com/repos/actions/checkout/git/tags/629c2de402a417ea7690ca6ce3f33229e27606a5
        with:
          fetch-depth: 0
          path: ${{ env.GOPATH }}/src/k8s.io/kops

      - name: Update go modules
        working-directory: ${{ env.GOPATH }}/src/k8s.io/kops
        run: |
          make gomod

      - name: Commit files
        working-directory: ${{ env.GOPATH }}/src/k8s.io/kops
        run: |
          git diff --exit-code && exit 0
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update go modules" -a
          git checkout -b $GITHUB_HEAD_REF
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
          git push --set-upstream origin "HEAD:$GITHUB_HEAD_REF" --atomic
